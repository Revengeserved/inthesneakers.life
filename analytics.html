<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Inside the Sneakers — Analytics</title>
  <style>
    :root { color-scheme: dark; --bg:#090912; --panel:#151525; --line:#35354f; --text:#f6f4ff; --muted:#aaa6c2; --hot:#ff3cac; --blue:#4cc9f0; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at top,#242044 0,#090912 48%); color:var(--text); }
    main { width:min(980px,calc(100% - 28px)); margin:0 auto; padding:42px 0 64px; }
    h1 { margin:0 0 8px; font-size:clamp(2rem,7vw,4rem); letter-spacing:-.05em; }
    .sub { color:var(--muted); margin:0 0 26px; }
    .panel { background:rgba(21,21,37,.94); border:1px solid var(--line); border-radius:20px; padding:20px; box-shadow:0 20px 70px rgba(0,0,0,.35); }
    form { display:grid; grid-template-columns:1fr auto; gap:10px; }
    input,button { border-radius:12px; border:1px solid var(--line); min-height:48px; font:inherit; }
    input { background:#0e0e19; color:var(--text); padding:0 14px; }
    button { cursor:pointer; color:#090912; font-weight:800; padding:0 18px; background:linear-gradient(90deg,var(--hot),var(--blue)); }
    button.secondary { background:transparent; color:var(--text); }
    .actions { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
    .status { min-height:24px; margin:14px 0 0; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:18px; }
    .metric { background:#0e0e19; border:1px solid var(--line); border-radius:16px; padding:16px; }
    .metric strong { display:block; font-size:2rem; }
    .metric span { color:var(--muted); }
    .tables { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
    h2 { margin:0 0 12px; font-size:1.1rem; }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:10px 6px; border-bottom:1px solid var(--line); text-align:left; font-size:.92rem; }
    th { color:var(--muted); font-weight:600; }
    td:last-child,th:last-child { text-align:right; }
    .hidden { display:none; }
    @media (max-width:720px){ form{grid-template-columns:1fr;} .grid{grid-template-columns:repeat(2,1fr)} .tables{grid-template-columns:1fr} }
  </style>
</head>
<body>
<main>
  <h1>Analytics Dashboard</h1>
  <p class="sub">Last 30 days for Inside the Sneakers. Your token is kept only in this browser tab.</p>

  <section class="panel">
    <form id="loginForm">
      <input id="token" type="password" autocomplete="off" placeholder="Paste your ANALYTICS_API_TOKEN" aria-label="Analytics API token" required>
      <button type="submit">Load analytics</button>
    </form>
    <div class="actions">
      <button class="secondary" id="refresh" type="button">Refresh</button>
      <button class="secondary" id="forget" type="button">Forget token</button>
    </div>
    <p class="status" id="status">Enter the same token you saved in Vercel.</p>
  </section>

  <section id="dashboard" class="hidden">
    <div class="grid">
      <div class="metric"><strong id="activeUsers">—</strong><span>Active users</span></div>
      <div class="metric"><strong id="newUsers">—</strong><span>New users</span></div>
      <div class="metric"><strong id="pageViews">—</strong><span>Page views</span></div>
      <div class="metric"><strong id="sessions">—</strong><span>Sessions</span></div>
    </div>
    <div class="tables">
      <section class="panel"><h2>Top pages</h2><table><thead><tr><th>Page</th><th>Views</th></tr></thead><tbody id="pages"></tbody></table></section>
      <section class="panel"><h2>Traffic sources</h2><table><thead><tr><th>Source</th><th>Sessions</th></tr></thead><tbody id="sources"></tbody></table></section>
    </div>
  </section>
</main>
<script>
  const tokenInput = document.querySelector('#token');
  const statusEl = document.querySelector('#status');
  const dashboard = document.querySelector('#dashboard');
  const storedToken = sessionStorage.getItem('analyticsToken');
  if (storedToken) tokenInput.value = storedToken;

  function safeText(value) { return String(value ?? ''); }

  async function loadAnalytics() {
    const token = tokenInput.value.trim();
    if (!token) { statusEl.textContent = 'Enter your token first.'; return; }
    sessionStorage.setItem('analyticsToken', token);
    statusEl.textContent = 'Loading…';
    dashboard.classList.add('hidden');
    try {
      const response = await fetch('/api/analytics', { headers: { Authorization: `Bearer ${token}` }, cache: 'no-store' });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.detail || data.error || `Request failed (${response.status})`);

      document.querySelector('#activeUsers').textContent = data.summary.activeUsers.toLocaleString();
      document.querySelector('#newUsers').textContent = data.summary.newUsers.toLocaleString();
      document.querySelector('#pageViews').textContent = data.summary.pageViews.toLocaleString();
      document.querySelector('#sessions').textContent = data.summary.sessions.toLocaleString();

      document.querySelector('#pages').replaceChildren(...data.topPages.map(item => {
        const row = document.createElement('tr');
        const page = document.createElement('td'); page.textContent = safeText(item.path);
        const views = document.createElement('td'); views.textContent = Number(item.pageViews || 0).toLocaleString();
        row.append(page, views); return row;
      }));

      document.querySelector('#sources').replaceChildren(...data.trafficSources.map(item => {
        const row = document.createElement('tr');
        const source = document.createElement('td'); source.textContent = `${safeText(item.source)} / ${safeText(item.medium)}`;
        const sessions = document.createElement('td'); sessions.textContent = Number(item.sessions || 0).toLocaleString();
        row.append(source, sessions); return row;
      }));

      dashboard.classList.remove('hidden');
      statusEl.textContent = `Updated ${new Date().toLocaleString()}`;
    } catch (error) {
      statusEl.textContent = error.message;
    }
  }

  document.querySelector('#loginForm').addEventListener('submit', event => { event.preventDefault(); loadAnalytics(); });
  document.querySelector('#refresh').addEventListener('click', loadAnalytics);
  document.querySelector('#forget').addEventListener('click', () => {
    sessionStorage.removeItem('analyticsToken');
    tokenInput.value = '';
    dashboard.classList.add('hidden');
    statusEl.textContent = 'Token forgotten from this browser tab.';
  });
  if (storedToken) loadAnalytics();
</script>
</body>
</html>
